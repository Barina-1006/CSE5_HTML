<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 5</title>
</head>
<body>

    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form>
        
        <label for="name"><b>Full Name:</b></label>
        <input type="text" id="name" name="fullname" placeholder="Enter your full name" required><br><br>

        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required><br><br>

        <label for="password"><b>Password:</b></label>
        <input type="password" id="password" name="password" placeholder="Enter password" required><br><br>

        <b>Gender:</b>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="course"><b>Course:</b></label>
        <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ee">Electrical Engineering</option>
        </select><br><br>

        <label for="contact"><b>Contact No:</b></label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number"><br><br>

        <label for="address"><b>Address:</b></label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

    <hr>
    <p align="center">&copy; 2025 Student Registration Portal</p>

</body>
</html>
